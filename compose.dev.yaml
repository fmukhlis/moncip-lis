services:
  moncip-lis:
    container_name: moncip-lis
    build:
      context: .
      target: dev
    env_file:
      - .env
      - .env.local
    volumes:
      - ./:/app
      - pnpm-store:/pnpm/store
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
      - opencode-state:/root/.local/state/opencode
      - opencode-cache:/root/.cache/opencode
    ports:
      - 3000:3000
      - "127.0.0.1:4096:4096"
    networks:
      - lis-his-network

  moncip-lis-db:
    image: postgres:17
    shm_size: 128mb
    environment:
      POSTGRES_USER: moncip_lis
      POSTGRES_PASSWORD: moncip_lis
    networks:
      - lis-his-network

  # Optional: a completely separate server for the suites that write to
  # Postgres, for anyone who would rather not keep a test database next to the
  # development one. `test/support/test-database.ts` accepts either layout, as
  # long as DATABASE_URL names the `moncip_lis_test` database.
  moncip-lis-db-test:
    image: postgres:17
    shm_size: 128mb
    environment:
      POSTGRES_USER: moncip_lis
      POSTGRES_PASSWORD: moncip_lis
      POSTGRES_DB: moncip_lis_test
    ports:
      - 5433:5432
    networks:
      - lis-his-network

  moncip-lis-adminer:
    image: adminer
    ports:
      - 8080:8080
    networks:
      - lis-his-network

volumes:
  pnpm-store:
  opencode-config:
  opencode-data:
  opencode-state:
  opencode-cache:

networks:
  lis-his-network:
    external: true
