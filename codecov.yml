coverage:
  status:
    project:
      default:
        # Ratchet: never let the total drop, but do not demand a number the
        # untested integration features cannot reach yet.
        target: auto
        threshold: 2%
    patch:
      default:
        # New code should be tested; UI wiring does not have to be exhaustive.
        target: 80%
        threshold: 5%
