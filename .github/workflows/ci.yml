name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  setup:
    name: Setup Node and Cache
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ${{ github.workspace }}/.next/cache
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

  lint:
    name: Lint and prettier check
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ${{ github.workspace }}/.next/cache
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - run: npx prettier . --check

      - run: pnpm run lint --max-warnings=0

  test:
    name: Run tests
    runs-on: ubuntu-22.04
    needs: setup
    # Every suite (unit and integration) runs against a throwaway Postgres that
    # is created for this job only. Nothing here can reach Neon staging: the
    # service container and the DATABASE_URL below are the only database the
    # job knows about, and the runner discards them when the job ends.
    services:
      postgres:
        # Matches the development database image in compose.dev.yaml.
        image: postgres:17
        env:
          POSTGRES_USER: moncip_lis
          POSTGRES_PASSWORD: moncip_lis
          POSTGRES_DB: moncip_lis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moncip_lis -d moncip_lis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Consumed by `prisma migrate deploy`, by Jest (unit + integration) and by
      # the Prisma client in lib/prisma.ts. Job-level scope keeps every step on
      # the local database by default.
      DATABASE_URL: postgresql://moncip_lis:moncip_lis@localhost:5432/moncip_lis_test?schema=public
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ${{ github.workspace }}/.next/cache
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      # The service container is already healthy here (GitHub Actions waits for
      # the pg_isready health check), so no manual wait script is needed.
      - run: pnpm prisma migrate deploy

      - run: pnpm run test --ci --coverage --runInBand

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: fmukhlis/moncip-lis

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: ${{github.ref_name == 'main' && 'Production' || 'Staging' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ${{ github.workspace }}/.next/cache
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
